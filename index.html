<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    #stage {
      width: 390px;
      height: 844px;
      background: #f2f2f7;
      position: relative;
      overflow: hidden;
    }

    #messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .row.left {
      justify-content: flex-start;
    }

    .row.right {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e5e5ea;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .row.right .avatar {
      background: #007aff;
      color: #fff;
      order: 2;
    }

    .bubble {
      max-width: 240px;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      opacity: 0;
    }

    .row.left .bubble {
      background: #fff;
      color: #111;
      border-bottom-left-radius: 6px;
    }

    .row.right .bubble {
      background: #007aff;
      color: #fff;
      border-bottom-right-radius: 6px;
      order: 1;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="chat"
    data-start="0"
    data-duration="10"
    data-width="390"
    data-height="844"
  >
    <div id="messages"></div>
  </div>

  <script id="chat-data" type="application/json">
    [
      { "side": "left", "content": "二十九块两百G的流量卡，插进去怎么显示无服务，这玩意儿是不是坏的？" },
      { "side": "right", "content": "停。你这是新手标准翻车姿势。流量卡不是普通SIM卡，插进去就能用？你想多了。" },
      { "side": "left", "content": "那怎么弄？客服说激活就行了啊。" },
      { "side": "right", "content": "激活不等于插卡。先扫码实名认证，再按卡套上的说明绑定套餐，最后才插卡。顺序反了，系统就认为你在乱搞。" },
      { "side": "left", "content": "我现在补激活还来得及吗？" },
      { "side": "right", "content": "来得及。把卡拔出来，按客服发的链接重新走一遍激活流程，激活完成后再插卡，重启手机就行。" }
    ]
  </script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const data = JSON.parse(
      document.getElementById("chat-data").textContent
    );

    const container = document.getElementById("messages");

    data.forEach((m) => {
      const row = document.createElement("div");
      row.className = "row " + (m.side === "right" ? "right" : "left");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = m.side === "right" ? "我" : "客服";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.content;

      row.appendChild(avatar);
      row.appendChild(bubble);
      container.appendChild(row);
    });

    const tl = gsap.timeline({ paused: true });
    const bubbles = document.querySelectorAll(".bubble");

    bubbles.forEach((b, i) => {
      tl.fromTo(
        b,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35 },
        i * 1.2
      );
    });

    window.__timelines = window.__timelines || {};
    window.__timelines.chat = tl;
  </script>
</body>
</html>
