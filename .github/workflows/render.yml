name: WeChat Render
on:
  workflow_dispatch:
    inputs:
      json: { description: "Base64 对话JSON", required: true, type: string }
      dark: { description: "深色 true/false", required: false, type: string, default: "false" }
      title: { description: "标题", required: false, type: string, default: "微信" }
      left_avatar: { description: "左头像", required: false, type: string, default: "A" }
      right_avatar: { description: "右头像", required: false, type: string, default: "我" }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | tee /etc/apt/sources.list.d/google-chrome.list
          apt-get update && apt-get install -y google-chrome-stable
      - name: Render
        env:
          INPUT_JSON: ${{ inputs.json }}
          DARK: ${{ inputs.dark }}
          TITLE: ${{ inputs.title }}
          LEFT_AVATAR: ${{ inputs.left_avatar }}
          RIGHT_AVATAR: ${{ inputs.right_avatar }}
        run: npm run render
      - uses: actions/upload-artifact@v4
        with: { name: wechat-video, path: output/output.mp4, retention-days: 1 }
