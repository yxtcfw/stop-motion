name: WeChat Render

on:
  workflow_dispatch:
    inputs:
      data_json:
        description: "data.json 内容（base64 编码的 UTF-8 JSON 字符串）"
        required: true
        type: string
      platform:
        description: "顶部标题 / 平台：微信/QQ/钉钉"
        required: false
        default: "微信"
        type: string
      left_name:
        description: "左侧头像文字"
        required: false
        default: "A"
        type: string
      right_name:
        description: "右侧头像文字"
        required: false
        default: "我"
        type: string
      dark:
        description: "深色模式"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk fonts-wqy-microhei fonts-wqy-zenhei fontconfig \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libatspi2.0-0
          fc-cache -fv

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install

      - name: Render video
        env:
          DATA_JSON: ${{ github.event.inputs.data_json }}
          PLATFORM: ${{ github.event.inputs.platform }}
          LEFT_NAME: ${{ github.event.inputs.left_name }}
          RIGHT_NAME: ${{ github.event.inputs.right_name }}
          DARK: ${{ github.event.inputs.dark }}
        run: node scripts/render.cjs

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: wechat-video
          path: output/output.mp4
          retention-days: 30
